name: Personal bundled deployment
on:
  pull_request:
    paths: ['deploy/custom/**', '.github/workflows/custom-deployment.yml', '.dockerignore', '.github/workflows/docker-image.yml', '.github/workflows/release.yaml']
  push:
    branches: [main, 'codex/cliproxyapi-deployment']
    tags: ['v*-custom.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'haipengTian/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify deployment gates and backend
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -m unittest discover -s deploy/custom/tests -v
          go test ./...
          go build -o /tmp/cliproxyapi ./cmd/server
      - name: Resolve pinned frontend
        id: ui
        run: |
          echo "repository=$(jq -r .repository deploy/custom/ui.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit deploy/custom/ui.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version deploy/custom/ui.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.ui.outputs.repository }}
          ref: ${{ steps.ui.outputs.commit }}
          path: _frontend
      - name: Verify and build frontend
        working-directory: _frontend
        env:
          VERSION: ${{ steps.ui.outputs.version }}
          LANG: en_US.UTF-8
        run: |
          bun install --frozen-lockfile
          bun run verify
      - name: Prepare bundled assets
        run: |
          mkdir -p .custom-build/ui
          cp _frontend/dist/index.html .custom-build/ui/management.html
          cp _frontend/LICENSE .custom-build/ui/LICENSE
          python3 deploy/custom/manifest.py .custom-build/ui
      - uses: docker/setup-buildx-action@v3
      - name: Record build time
        id: metadata
        run: echo "date=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Build actual amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/custom/Dockerfile
          build-contexts: custom_ui=.custom-build/ui
          platforms: linux/amd64
          load: true
          tags: cliproxyapi-custom:verify
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Offline deployment and persistent configuration regression
        run: python3 deploy/custom/tests/smoke.py cliproxyapi-custom:verify
      - name: Save the exact tested image
        run: docker save cliproxyapi-custom:verify | gzip > .custom-build/tested-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image-amd64
          path: .custom-build/tested-image.tar.gz
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-ui
          path: .custom-build/ui
          include-hidden-files: true
  publish:
    if: github.repository == 'haipengTian/CLIProxyAPI' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-custom.')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag and main ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: bundled-ui
          path: .custom-build/ui
      - uses: actions/download-artifact@v4
        with:
          name: tested-image-amd64
          path: .custom-build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: metadata
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish the exact tested amd64 image
        id: image
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gunzip -c .custom-build/tested-image.tar.gz | docker load
          image="ghcr.io/haipengtian/cliproxyapi:$IMAGE_TAG"
          docker tag cliproxyapi-custom:verify "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk '/^ghcr.io\/haipengtian\/cliproxyapi@sha256:/ {sub(/^.*@/, ""); print; exit}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create paired release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          jq --arg digest "$IMAGE_DIGEST" --arg tag "$IMAGE_TAG" '. + {image_digest: $digest, image_tag: $tag, architecture: "linux/amd64"}' .custom-build/ui/release.json > .custom-build/release.json
          printf 'Bundled backend and pinned personal management frontend.\n\nImage: `ghcr.io/haipengtian/cliproxyapi:%s`\nDigest: `%s`\nArchitecture tested: linux/amd64.\n' "$IMAGE_TAG" "$IMAGE_DIGEST" > .custom-build/release-notes.md
          gh release create "$GITHUB_REF_NAME" .custom-build/release.json .custom-build/ui/management.html --title "$GITHUB_REF_NAME" --notes-file .custom-build/release-notes.md
